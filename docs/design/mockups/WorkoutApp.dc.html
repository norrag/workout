<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    .wk-scroll::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</helmet>
<div style="{{ rootStyle }}">
  {{ statusBar }}
  {{ screen }}
  {{ tabBar }}
  {{ overlay }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:824},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper'|'dark'&quot;},&quot;instance&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    loaded: false,
    tab: 'workout',
    phase: 'logging',          // logging | feedback | complete
    headerOpen: false,
    week: 'W2', day: 'D1',
    exercises: this.defaultExercises(false),
    edit: null,                // { ei, si, field }
    exMenu: null,              // ei
    feedback: { pain: 'none', pump: 6, workload: 5 },
    notes: '',
    units: 'lb',
    expandedMacro: '26-1',
    chooser: false,
    completedDays: [],
    macros: this.defaultMacros(),
    cyView: 'list', cyMacro: null, cyMeso: null, mesoTab: 'balance', mesoModal: null, mesoDraft: null, exTab: 'overview', draft: null, moreView: 'main', exDetail: null, tplDetail: null, exType: 'ALL',
    exFilter: 'ALL', exSearch: '',
    tpl: 0,
  };

  // ---------- data ----------
  defaultExercises(fresh) {
    const e = [
      { n: 'Hack Squat', g: 'QUADS', q: 'MACHINE', sets: [ {w:250,r:8}, {w:250,r:7}, {w:250,r:6}, {w:250,r:6} ] },
      { n: 'Leg Extension', g: 'QUADS', q: 'MACHINE', sets: [ {w:130,r:12}, {w:130,r:12}, {w:130,r:11} ] },
      { n: 'Cable Pushdown (1-arm)', g: 'TRICEPS', q: 'CABLE', note: 'PINNED — handle grip, underhand, strict', sets: [ {w:45,r:13}, {w:45,r:13}, {w:45,r:12}, {w:45,r:11} ] },
      { n: 'Overhead Cable Ext', g: 'TRICEPS', q: 'CABLE', sets: [ {w:60,r:12}, {w:60,r:11}, {w:60,r:10} ] },
    ];
    e.forEach(x => x.sets.forEach(s => { s.d = false; }));
    if (!fresh) { e[0].sets[0].d = true; e[0].sets[1].d = true; e[2].sets[0].d = true; }
    return e;
  }

  // ---------- persistence ----------
  key() { return 'workout-proto-' + (this.props.instance || this.props.theme || 'a'); }
  persistState() {
    const s = this.state;
    return { tab: s.tab, phase: s.phase, week: s.week, day: s.day, exercises: s.exercises,
      feedback: s.feedback, notes: s.notes, units: s.units, expandedMacro: s.expandedMacro,
      completedDays: s.completedDays, exFilter: s.exFilter, tpl: s.tpl, macros: s.macros, exType: s.exType };
  }
  componentDidMount() {
    try {
      const raw = localStorage.getItem(this.key());
      if (raw) {
        const p = JSON.parse(raw);
        const merged = Object.assign({}, p, { loaded: true, edit: null, exMenu: null, chooser: false, headerOpen: false, exSearch: '', cyView: 'list', cyMacro: null, cyMeso: null, mesoTab: 'balance', mesoModal: null, mesoDraft: null, exTab: 'overview', draft: null });
        if (!merged.macros || !merged.macros[0] || !merged.macros[0].ov) merged.macros = this.defaultMacros();
        this.setState(merged);
        return;
      }
    } catch (e) {}
    this.setState({ loaded: true });
  }
  componentDidUpdate() {
    if (this.state.loaded) { try { localStorage.setItem(this.key(), JSON.stringify(this.persistState())); } catch (e) {} }
  }

  // ---------- tokens ----------
  t() {
    if (this.props.theme === 'dark') return {
      bg:'#0B0B0C', surface:'#141416', raised:'#1C1C1F', field:'#1C1C1F',
      ink:'#F2F2F0', soft:'#9A9AA0', softer:'rgba(154,154,160,0.65)', faint:'rgba(154,154,160,0.32)',
      line:'#26262A', lineSoft:'rgba(154,154,160,0.16)', heavy:'#34343A',
      accent:'#C8593B', accentDim:'rgba(200,89,59,0.18)', onAccent:'#0B0B0C',
      positive:'#5E9B79', warning:'#C7A050',
      rCard:6, rInput:4, bw:1, dark:true,
      statusInk:'#F2F2F0', pop:'0 16px 40px rgba(0,0,0,0.6)', navBorder:'1px solid #26262A',
      cardFill:'#141416', selFill:'#F2F2F0', selInk:'#0B0B0C',
    };
    return {
      bg:'#F4F0E6', surface:'#F4F0E6', raised:'rgba(23,20,15,0.05)', field:'#FCFAF4',
      ink:'#17140F', soft:'rgba(23,20,15,0.55)', softer:'rgba(23,20,15,0.45)', faint:'rgba(23,20,15,0.3)',
      line:'#17140F', lineSoft:'rgba(23,20,15,0.18)', heavy:'#17140F',
      accent:'#C14B2A', accentDim:'rgba(193,75,42,0.12)', onAccent:'#F4F0E6',
      positive:'#3C7A55', warning:'#B98A2E',
      rCard:0, rInput:0, bw:1.5, dark:false,
      statusInk:'#17140F', pop:'5px 5px 0 rgba(23,20,15,0.85)', navBorder:'2px solid #17140F',
      cardFill:'transparent', selFill:'#17140F', selInk:'#F4F0E6',
    };
  }

  // ---------- helpers ----------
  totals() { let logged=0,total=0; this.state.exercises.forEach(ex=>ex.sets.forEach(s=>{total++; if(s.d)logged++;})); return {logged,total}; }
  go(id) { this.setState({ tab:id, phase:'logging', chooser:false, edit:null, exMenu:null, cyView:'list', cyMacro:null, draft:null, moreView:'main', exDetail:null, tplDetail:null }); }
  toggleLog(ei,si) { this.setState(s=>({ exercises: s.exercises.map((x,i)=> i!==ei?x:Object.assign({},x,{sets:x.sets.map((st,j)=> j!==si?st:Object.assign({},st,{d:!st.d}))})) })); }
  openStep(ei,si,field) { this.setState({ edit:{ei,si,field} }); }
  stepEdit(dir) {
    const e=this.state.edit; if(!e) return;
    const step = e.field==='w' ? (this.state.units==='kg'?2.5:5) : 1;
    this.setState(s=>({ exercises: s.exercises.map((x,i)=> i!==e.ei?x:Object.assign({},x,{sets:x.sets.map((st,j)=>{
      if(j!==e.si) return st; const v=Math.max(0,(e.field==='w'?st.w:st.r)+dir*step);
      return Object.assign({}, st, e.field==='w'?{w:v}:{r:v});
    })})) }));
  }
  addSet(ei){ this.setState(s=>({ exercises:s.exercises.map((x,i)=>{ if(i!==ei)return x; const last=x.sets[x.sets.length-1]||{w:0,r:0}; return Object.assign({},x,{sets:x.sets.concat([{w:last.w,r:last.r,d:false}])}); }), exMenu:null })); }
  removeExercise(ei){ this.setState(s=>({ exercises:s.exercises.filter((_,i)=>i!==ei), exMenu:null })); }
  startFeedback(){ this.setState({ phase:'feedback', edit:null, exMenu:null }); }
  nextWorkout(){
    const order=['D1','D2','D3','D4','D5'];
    const idx=order.indexOf(this.state.day);
    const nextDay=order[Math.min(idx+1,order.length-1)];
    const cd=(this.state.completedDays||[]).concat([this.state.week+'·'+this.state.day]);
    this.setState({ completedDays:cd, day:nextDay, exercises:this.defaultExercises(true), phase:'logging', notes:'', feedback:{pain:'none',pump:6,workload:5}, headerOpen:false });
  }
  unit(){ return this.state.units.toUpperCase(); }

  // ====================================================================
  renderVals() {
    const T = this.t();
    const rootStyle = { position:'relative', width:'100%', height:'100%', background:T.bg, color:T.ink,
      fontFamily:"'Archivo', sans-serif", display:'flex', flexDirection:'column', overflow:'hidden', WebkitFontSmoothing:'antialiased' };
    if (!this.state.loaded) return { rootStyle, statusBar:null, screen:null, tabBar:null, overlay:null };
    let screen;
    switch (this.state.tab) {
      case 'cycles': screen=this.renderCycles(T); break;
      case 'templates': screen=this.renderTemplates(T); break;
      case 'exercises': screen=this.renderExercises(T); break;
      case 'more': screen=this.renderMore(T); break;
      default: screen=this.renderWorkout(T);
    }
    return { rootStyle, statusBar:this.renderStatus(T), screen, tabBar:this.renderTabBar(T), overlay:this.renderOverlay(T) };
  }

  // ---------- status bar ----------
  renderStatus(T){ const h=React.createElement; const c=T.statusInk;
    const icons=h('div',{style:{display:'flex',alignItems:'center',gap:'7px'}},
      h('svg',{key:'s',width:18,height:11,viewBox:'0 0 18 11'},
        h('rect',{key:1,x:0,y:7,width:3,height:4,rx:0.6,fill:c}),
        h('rect',{key:2,x:4.5,y:4.5,width:3,height:6.5,rx:0.6,fill:c}),
        h('rect',{key:3,x:9,y:2,width:3,height:9,rx:0.6,fill:c}),
        h('rect',{key:4,x:13.5,y:0,width:3,height:11,rx:0.6,fill:c})),
      h('svg',{key:'w',width:16,height:11,viewBox:'0 0 16 11'},
        h('path',{d:'M8 3C10.2 3 12.2 3.9 13.6 5.3L14.7 4.2C13 2.5 10.6 1.4 8 1.4C5.4 1.4 3 2.5 1.3 4.2L2.4 5.3C3.8 3.9 5.8 3 8 3Z',fill:c}),
        h('circle',{cx:8,cy:9.4,r:1.4,fill:c})),
      h('svg',{key:'b',width:25,height:12,viewBox:'0 0 25 12'},
        h('rect',{x:0.5,y:0.5,width:21,height:11,rx:3,stroke:c,strokeOpacity:0.4,fill:'none'}),
        h('rect',{x:2,y:2,width:18,height:8,rx:1.6,fill:c}),
        h('path',{d:'M23 4V8C23.7 7.7 24.2 7 24.2 6C24.2 5 23.7 4.3 23 4Z',fill:c,fillOpacity:0.4})));
    return h('div',{style:{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'15px 26px 5px',position:'relative',zIndex:6}},
      h('div',{style:{fontSize:'15px',fontWeight:700,letterSpacing:'0.01em',fontFamily:'-apple-system, system-ui',color:c}},'9:41'),
      icons);
  }

  // ---------- tab bar ----------
  renderTabBar(T){ const h=React.createElement;
    const tabs=[['workout','WORKOUT'],['cycles','CYCLES'],['templates','TEMPLATES'],['exercises','EXERCISES'],['more','MORE']];
    return h('div',{style:{flexShrink:0,borderTop:T.navBorder,background:T.bg,display:'flex',padding:'11px 4px 26px',position:'relative',zIndex:5}},
      tabs.map(([id,label])=>{ const active=this.state.tab===id;
        return h('div',{key:id,onClick:()=>this.go(id),style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:'4px',fontSize:'8.5px',letterSpacing:'0.09em',fontWeight:active?700:500,color:active?T.ink:T.softer,cursor:'pointer'}},
          active?h('span',{key:'m',style:{width:'5px',height:'5px',background:T.accent,display:'inline-block'}}):null, label);
      }));
  }

  // ---------- workout ----------
  renderWorkout(T){ const h=React.createElement;
    const list=h('div',{className:'wk-scroll',style:{flex:1,minHeight:0,overflowY:'auto',padding:'2px 20px 14px'}},
      this.state.exercises.map((ex,ei)=>this.renderExBlock(T,ex,ei)),
      this.state.exercises.length===0?h('div',{style:{padding:'40px 0',textAlign:'center',color:T.softer,fontSize:'13px'}},'No exercises'):null);
    const tt=this.totals(); const remaining=tt.total-tt.logged;
    const finish=h('div',{style:{flexShrink:0,padding:'10px 20px',borderTop:'1px solid '+T.lineSoft,background:T.bg}},
      h('div',{onClick:()=>this.startFeedback(),style:{height:'52px',background:T.selFill,color:T.selInk,display:'flex',alignItems:'center',justifyContent:'center',gap:'9px',fontSize:'13px',fontWeight:700,letterSpacing:'0.12em',cursor:'pointer',borderRadius:T.rInput+'px'}},
        remaining>0?('FINISH — '+remaining+' SET'+(remaining===1?'':'S')+' LEFT'):'FINISH WORKOUT',
        h('span',{style:{fontSize:'15px'}},'→')));
    return h('div',{style:{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}, this.renderDayHeader(T), list, finish);
  }

  renderExBlock(T,ex,ei){ const h=React.createElement;
    const iconBtn=(child,onClick)=>h('div',{onClick,style:{width:28,height:28,border:T.bw+'px solid '+(T.dark?T.line:'rgba(23,20,15,0.35)'),borderRadius:T.rInput+'px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:T.ink}},child);
    const head=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('div',{style:{fontSize:'10px',fontWeight:600,letterSpacing:'0.16em',color:T.soft}}, this.pad(ei+1)+' — '+ex.g),
      h('div',{style:{display:'flex',gap:'7px'}},
        iconBtn(h('svg',{width:13,height:13,viewBox:'0 0 14 14'},h('circle',{cx:7,cy:7,r:5.5,fill:'none',stroke:T.ink,strokeWidth:1.3}),h('path',{d:'M7 4v3l2 1.5',fill:'none',stroke:T.ink,strokeWidth:1.3})), ()=>this.go('exercises')),
        iconBtn(h('div',{style:{fontSize:'13px',letterSpacing:'1px',marginTop:'-7px'}},'…'), ()=>this.setState({exMenu:ei}))));
    const title=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:'2px'}},
      h('div',{style:{fontSize:'20px',fontWeight:700,letterSpacing:'-0.01em'}}, ex.n),
      h('div',{style:{fontSize:'9.5px',fontWeight:500,letterSpacing:'0.12em',color:T.softer}}, ex.q));
    const note=ex.note?h('div',{style:{fontSize:'11px',fontWeight:500,marginTop:'7px',padding:'4px 0 5px 10px',borderLeft:'2px solid '+T.accent,color:T.soft}}, ex.note):null;
    const colHead=h('div',{style:{display:'grid',gridTemplateColumns:'20px 1fr 1fr 44px',gap:'10px',marginTop:ex.note?'8px':'10px',paddingBottom:'5px',borderBottom:'1px solid '+(T.dark?T.lineSoft:'rgba(23,20,15,0.25)'),fontSize:'9px',fontWeight:600,letterSpacing:'0.14em',color:T.softer}},
      h('div',null),h('div',{style:{textAlign:'center'}},this.unit()),h('div',{style:{textAlign:'center'}},'REPS'),h('div',{style:{textAlign:'center'}},'LOG'));
    const rows=ex.sets.map((st,si)=>this.renderSetRow(T,ex,ei,st,si));
    return h('div',{key:ei,style:{marginTop:ei===0?'14px':'20px'}}, head, title, note, colHead, rows);
  }

  renderSetRow(T,ex,ei,st,si){ const h=React.createElement;
    const isNext = !st.d && ex.sets.findIndex(x=>!x.d)===si;
    const numBox=(field,val)=>{
      let style={ height:'32px',borderRadius:T.rInput+'px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',fontWeight:600,fontVariantNumeric:'tabular-nums',cursor:'pointer',transition:'background .12s' };
      if(st.d){ style.background=T.dark?T.raised:'rgba(23,20,15,0.05)'; style.border=T.bw+'px solid '+(T.dark?T.line:'rgba(23,20,15,0.3)'); style.color=T.soft; }
      else if(isNext){ style.background=T.field; style.border=(T.bw+0.0)+'px solid '+T.accent; style.color=T.ink; }
      else { style.background=T.dark?'transparent':T.field; style.border=T.bw+'px solid '+(T.dark?T.line:'rgba(23,20,15,0.25)'); style.color=T.ink; }
      return h('div',{onClick:()=>this.openStep(ei,si,field),style},this.fmt(val,field));
    };
    let chk;
    if(st.d) chk=h('div',{style:{width:21,height:21,background:T.selFill,color:T.selInk,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',borderRadius:T.dark?'5px':'0',cursor:'pointer'}},'✓');
    else if(isNext) chk=h('div',{style:{width:21,height:21,border:'2px solid '+T.accent,boxSizing:'border-box',borderRadius:T.dark?'5px':'0',cursor:'pointer'}});
    else chk=h('div',{style:{width:21,height:21,border:'2px solid '+(T.dark?T.heavy:'rgba(23,20,15,0.35)'),boxSizing:'border-box',borderRadius:T.dark?'5px':'0',cursor:'pointer'}});
    return h('div',{key:si,style:{display:'grid',gridTemplateColumns:'20px 1fr 1fr 44px',gap:'10px',alignItems:'center',padding:'4px 0',borderBottom:'1px solid '+T.lineSoft}},
      h('div',{style:{color:T.faint,fontSize:'14px',textAlign:'center',lineHeight:0.5}},'⋮'),
      numBox('w',st.w), numBox('r',st.r),
      h('div',{onClick:()=>this.toggleLog(ei,si),style:{display:'flex',justifyContent:'center',alignItems:'center',height:'44px',cursor:'pointer'}}, chk));
  }

  renderDayHeader(T){ const h=React.createElement;
    const open=this.state.headerOpen, selWeek=this.state.week, selDay=this.state.day;
    const weeks=[{w:'W1',s:'past',t:'3 RIR'},{w:'W2',s:'current',t:'2 RIR'},{w:'W3',s:'future',t:'1 RIR'},{w:'W4',s:'future',t:'0 RIR'},{w:'DL',s:'deload',t:'DELOAD'}];
    const dayData={ W1:[['D1','done'],['D2','done'],['D3','done'],['D4','done'],['D5','done']],
      W2:[['D1','current'],['D2','todo'],['D3','todo'],['D4','todo'],['D5','todo']],
      W3:[['D1','todo'],['D2','todo'],['D3','todo'],['D4','todo'],['D5','todo']],
      W4:[['D1','todo'],['D2','todo'],['D3','todo'],['D4','todo'],['D5','todo']],
      DL:[['D1','todo'],['D2','todo'],['D3','todo']] };
    const cur=weeks.find(x=>x.w===selWeek)||weeks[1];
    const days=dayData[selWeek]||[];
    const lastIdx=weeks.length-1;
    const weekTabs=weeks.map((wk,i)=>{ const isSel=wk.w===selWeek;
      const st={flex:wk.w==='DL'?'0.82':'1',height:'36px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',letterSpacing:'0.08em',position:'relative',cursor:'pointer',borderRight:i<lastIdx?'1px solid '+T.lineSoft:'none',transition:'background .15s,color .15s'};
      if(isSel){st.background=T.selFill;st.color=T.selInk;st.fontWeight=700;}
      else if(wk.s==='past'){st.color=T.soft;st.fontWeight=600;}
      else {st.color=T.softer;st.fontWeight=wk.s==='deload'?600:500;}
      const dot=wk.s==='current'?h('div',{key:'c',style:{position:'absolute',top:'5px',right:'5px',width:'5px',height:'5px',background:T.accent,borderRadius:'50%'}}):null;
      return h('div',{key:wk.w,onClick:()=>this.setState({week:wk.w}),style:st},wk.w,dot);
    });
    const dayChips=days.map(([d,s])=>{ const isSel=d===selDay; const isActual=selWeek==='W2'&&d==='D1';
      const st={flex:'1',height:'30px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10.5px',letterSpacing:'0.04em',position:'relative',cursor:'pointer',transition:'background .15s,color .15s',border:T.bw+'px solid '+(T.dark?T.line:'rgba(23,20,15,0.22)'),borderRadius:T.rInput+'px',color:T.softer,fontWeight:500};
      if(isSel){st.background=T.selFill;st.color=T.selInk;st.fontWeight=700;st.border=T.bw+'px solid '+T.selFill;}
      else if(s==='done'){st.background=T.dark?T.raised:'rgba(23,20,15,0.07)';st.color=T.soft;st.fontWeight=600;}
      const dot=(isActual&&!isSel)?h('div',{key:'c',style:{position:'absolute',top:'4px',right:'4px',width:'5px',height:'5px',background:T.accent,borderRadius:'50%'}}):null;
      const tick=(s==='done'&&!isSel)?h('span',{key:'t',style:{marginLeft:'3px',fontSize:'8px',opacity:0.6}},'✓'):null;
      return h('div',{key:d,onClick:()=>this.setState({day:d}),style:st},d,tick,dot);
    });
    const selector=h('div',{style:{border:T.bw+'px solid '+T.line,borderRadius:T.rInput+'px',overflow:'hidden'}},
      h('div',{style:{display:'flex'}},weekTabs),
      h('div',{style:{borderTop:T.bw+'px solid '+T.line,padding:'11px',background:T.dark?T.raised:'rgba(23,20,15,0.03)'}},
        h('div',{style:{display:'flex',gap:'5px'}},dayChips)));
    const panel=h('div',{style:{display:'grid',gridTemplateRows:open?'1fr':'0fr',opacity:open?1:0,marginTop:open?'14px':'0px',transition:'grid-template-rows .3s ease, opacity .25s ease, margin-top .3s ease'}},
      h('div',{style:{overflow:'hidden',minHeight:0}},selector));
    // live progress for active day
    const tt=this.totals();
    let dateLine,logged,total;
    if(selWeek==='W2'&&selDay==='D1'){dateLine='MON 12 JUN';logged=tt.logged;total=tt.total;}
    else { const ds=(days.find(([d])=>d===selDay)||[])[1]; if(ds==='done'){dateLine='COMPLETED';logged=14;total=14;}else{dateLine='SCHEDULED';logged=0;total=14;} }
    const pct=total?Math.round((logged/total)*100):0;
    const rir=cur.s==='deload'?'DELOAD WEEK':('TARGET '+cur.t);
    const coord=h('div',{style:{marginTop:'15px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end',paddingBottom:'10px'}},
        h('div',{style:{fontSize:'44px',fontWeight:800,letterSpacing:'-0.03em',lineHeight:0.9}},selWeek+'·'+selDay),
        h('div',{style:{fontSize:'10px',fontWeight:500,letterSpacing:'0.1em',color:T.soft,textAlign:'right',lineHeight:1.5}},
          dateLine,h('br',{key:'b'}),h('span',{key:'r',style:{color:T.accent,fontWeight:700}},rir))),
      h('div',{style:{position:'relative',height:'3px',background:T.dark?T.heavy:T.ink}},
        h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:pct+'%',background:T.accent,transition:'width .3s ease'}})));

  durWeeks(mo){ return {3:13,6:26,12:52}[mo] || Math.round(mo*4.345); }

  phaseSeq(goal,n){ const A='Accumulation',I='Intensification',P='Peak',M='Maintenance';
    if(n<=0) return [];
    if(goal==='Maintain') return Array(n).fill(M);
    if(goal==='Cut') return Array.from({length:n},(_,i)=> i===n-1?I : (i%2?M:A));
    if(goal==='Strength') return Array.from({length:n},(_,i)=>{const f=n>1?i/(n-1):0; return f<0.34?A:(f<0.84?I:P);});
    return Array.from({length:n},(_,i)=>{const f=n>1?i/(n-1):0; return f<0.45?A:(f<0.85?I:P);});
  }

    if(goal==='Strength') return {band:'+'+R(m*1)+'–'+R(m*2)+'% on key lifts', rate:'≈ +1–2% / month', basis:'Intermediate · 3 main lifts'};
    if(goal==='Cut') return {band:'\u2212'+R(m*2.2)+' to \u2212'+R(m*3.4)+' lb fat', rate:'≈ −2.2–3.4 lb / month', basis:'Strength retained · 198 lb start'};

      h('div',{style:{position:'absolute',top:'120px',right:'20px',width:'230px',background:T.bg,border:T.bw+'px solid '+T.line,borderRadius:T.rCard+'px',boxShadow:T.pop,zIndex:32}},
        h('div',{style:{padding:'12px 16px 9px',borderBottom:T.bw+'px solid '+T.lineSoft,fontSize:'9.5px',fontWeight:600,letterSpacing:'0.16em',color:T.soft}},'EXERCISE — '+ex.n.toUpperCase()),
        item('Add set',()=>this.addSet(ei)),
        item('View exercise',()=>this.openExercise(ex)),
        item('Swap exercise',()=>this.setState({exMenu:null})),
        item('Remove exercise',()=>this.removeExercise(ei),true)));
  }

  renderChooser(T){ const h=React.createElement;
    const opt=(big,sub,onClick)=>h('div',{onClick,style:{padding:'16px',border:T.bw+'px solid '+T.line,borderRadius:T.rCard+'px',marginTop:'10px',cursor:'pointer'}},
      h('div',{style:{fontSize:'16px',fontWeight:700}},big),
      h('div',{style:{fontSize:'12px',color:T.soft,marginTop:'4px',lineHeight:1.4}},sub));
    return h('div',{style:{position:'absolute',inset:0,zIndex:31}}, this.dim(()=>this.setState({chooser:false})),
      h('div',{style:{position:'absolute',left:0,right:0,bottom:0,background:T.bg,borderTop:T.bw+'px solid '+T.line,borderTopLeftRadius:T.dark?'18px':'0',borderTopRightRadius:T.dark?'18px':'0',padding:'18px 22px 40px',zIndex:32,boxShadow:T.dark?'0 -16px 40px rgba(0,0,0,0.5)':'none'}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          h('div',{style:{fontSize:'13px',fontWeight:700,letterSpacing:'0.04em'}},'Create new'),
          h('div',{onClick:()=>this.setState({chooser:false}),style:{fontSize:'16px',color:T.soft,cursor:'pointer'}},'✕')),
        opt('Macrocycle','A long-term goal organizing several mesocycles.',()=>this.startCreate()),
        opt('Standalone mesocycle','A single training block, not tied to a macrocycle.',()=>{ const m=(this.state.macros||[])[0]; const idx=m?m.mesos.findIndex(x=>x.status==='unplanned'):-1; if(m&&idx>=0){ this.setState({chooser:false}); this.startCreateMeso(m.id,idx); } else { this.setState({chooser:false}); } })));
  }

  renderCreateMeso(T){ const h=React.createElement; const d=this.state.mesoDraft||{name:'',weeks:5};
    const mm=this.state.mesoModal; const m=mm&&this.macroById(mm.macroId); const idx=mm&&mm.idx;
    const close=()=>this.setState({mesoModal:null,mesoDraft:null});
    const placement= m?m.mesos.map((ms,i)=>{ const done=ms.status==='done'||ms.status==='current'; const isThis=i===idx;
      return h('div',{key:i,style:{flex:1,height:'34px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9.5px',fontWeight:isThis?800:600,letterSpacing:'0.06em',boxSizing:'border-box',
        background:done?T.selFill:'transparent',color:done?T.selInk:(isThis?T.accent:T.softer),
        border:done?'none':(isThis?'2px solid '+T.accent:'1px dashed '+(T.dark?T.heavy:'rgba(23,20,15,0.4)'))}},'M'+(i+1)+(done?' \u2713':''));
    }):null;
    const weeks=[4,5,6,7,8];
    return h('div',{style:{position:'absolute',inset:0,zIndex:31}}, this.dim(close),
      h('div',{style:{position:'absolute',left:0,right:0,bottom:0,maxHeight:'94%',overflowY:'auto',background:T.bg,borderTop:(T.dark?T.bw:2)+'px solid '+T.line,borderTopLeftRadius:(T.dark?T.rCard:0)+'px',borderTopRightRadius:(T.dark?T.rCard:0)+'px',padding:'22px 20px 40px',zIndex:32,boxShadow:T.dark?'0 -16px 40px rgba(0,0,0,0.55)':'none'},className:'wk-scroll'},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline'}},
          h('div',{style:{fontSize:'26px',fontWeight:800,letterSpacing:'-0.02em'}},'Create mesocycle'),
          h('div',{onClick:close,style:{fontSize:'16px',color:T.soft,cursor:'pointer'}},'\u2715')),
        h('div',{style:{fontSize:'10px',fontWeight:600,letterSpacing:'0.14em',color:T.softer,marginTop:'22px'}},'NAME'),
        h('input',{value:d.name,onChange:(e)=>this.setState(s=>({mesoDraft:Object.assign({},s.mesoDraft,{name:e.target.value})})),style:{width:'100%',height:'48px',background:T.field,border:T.bw+'px solid '+T.line,padding:'0 14px',fontSize:'14px',fontWeight:600,marginTop:'8px',fontFamily:"'Archivo',sans-serif",color:T.ink,outline:'none',borderRadius:T.rInput+'px',boxSizing:'border-box'}}),
        m?h('div',{style:{fontSize:'10px',fontWeight:600,letterSpacing:'0.14em',color:T.softer,marginTop:'20px'}},'MACROCYCLE PLACEMENT \u2014 '+m.code+(m.sub?(' \u00B7 '+m.sub.toUpperCase()):'')):null,
        m?h('div',{style:{display:'flex',gap:'5px',marginTop:'8px'}}, placement):null,
        m?h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'6px',fontSize:'9px',fontWeight:500,letterSpacing:'0.1em',color:T.softer}},
          h('span',null,m.span.split('\u2014')[0].trim()),h('span',{style:{color:T.accent,fontWeight:700}},'MESO '+(idx+1)+' OF '+m.mesos.length+' \u00B7 '+(m.mesos[idx]?m.mesos[idx].phase.toUpperCase():'')),h('span',null,m.span.split('\u2014')[1]?m.span.split('\u2014')[1].trim():'')):null,
        h('div',{style:{fontSize:'10px',fontWeight:600,letterSpacing:'0.14em',color:T.softer,marginTop:'20px'}},'WEEKS \u2014 INCLUDING DELOAD'),
        h('div',{style:{display:'flex',border:T.bw+'px solid '+T.line,marginTop:'8px',borderRadius:T.rInput+'px',overflow:'hidden'}},
          weeks.map((w,i)=>{const on=d.weeks===w; return h('div',{key:w,onClick:()=>this.setState(s=>({mesoDraft:Object.assign({},s.mesoDraft,{weeks:w})})),style:{flex:1,textAlign:'center',fontSize:'14px',fontWeight:on?700:500,padding:'13px 0',fontVariantNumeric:'tabular-nums',cursor:'pointer',background:on?T.selFill:'transparent',color:on?T.selInk:T.ink,borderLeft:i>0?'1px solid '+(T.dark?T.line:'rgba(23,20,15,0.25)'):'none'}},w);})),
        h('div',{style:{fontSize:'10px',fontWeight:500,letterSpacing:'0.08em',color:T.softer,marginTop:'7px'}},'RIR RAMP: 3 \u2192 0 \u00B7 W'+d.weeks+' DELOAD AT 8 RIR'),
        h('div',{style:{display:'flex',gap:'10px',marginTop:'26px',alignItems:'center',justifyContent:'flex-end'}},
          h('div',{onClick:close,style:{fontSize:'13px',fontWeight:600,padding:'12px 18px',color:T.soft,cursor:'pointer'}},'Cancel'),
          h('div',{onClick:()=>this.confirmCreateMeso(),style:{background:T.selFill,color:T.selInk,fontSize:'13px',fontWeight:700,letterSpacing:'0.08em',padding:'14px 32px',cursor:'pointer',borderRadius:T.rInput+'px'}},'CREATE'))));
  }

  renderFeedback(T){ const h=React.createElement; const fb=this.state.feedback;
    const set=(patch)=>this.setState(s=>({feedback:Object.assign({},s.feedback,patch)}));
    const painOpts=[['none','None'],['low','Low'],['moderate','Moderate'],['high','High']];
    const pain=h('div',{style:{marginTop:'22px'}},
      h('div',{style:{fontSize:'13px',fontWeight:700}},'Joint pain ',h('span',{style:{fontWeight:400,color:T.soft,fontSize:'12px'}},'\u2014 during deadlift')),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'7px',marginTop:'9px'}},
        painOpts.map(([k,lbl])=>{const sel=fb.pain===k; return h('div',{key:k,onClick:()=>set({pain:k}),style:{height:'46px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:sel?700:500,cursor:'pointer',borderRadius:T.rInput+'px',background:sel?T.accent:'transparent',color:sel?T.onAccent:T.ink,border:T.bw+'px solid '+(sel?T.accent:(T.dark?T.line:'rgba(23,20,15,0.4)'))}},lbl);})));
    const slider=(key,labelMain,labelSpan,info,leftL,rightL,centerL,tipBox)=>{const v=fb[key]; const stops=11; const pct=(v/(stops-1))*100;
      return h('div',{style:{marginTop:'22px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          h('div',{style:{fontSize:'13px',fontWeight:700}},labelMain,h('span',{style:{fontWeight:400,color:T.soft,fontSize:'12px'}},labelSpan)),
          h('div',{style:{width:17,height:17,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700,border:info==='filled'?'none':'1px solid '+(T.dark?T.heavy:'rgba(23,20,15,0.5)'),background:info==='filled'?T.ink:'transparent',color:info==='filled'?T.bg:T.soft}},'i')),
        tipBox?h('div',{style:{borderLeft:'2px solid '+(T.dark?T.heavy:T.ink),padding:'6px 0 6px 10px',marginTop:'9px',fontSize:'11.5px',lineHeight:1.5,color:T.soft}},tipBox):null,
        h('div',{style:{position:'relative',height:'34px',marginTop:'12px'}},
          h('div',{style:{position:'absolute',left:0,right:0,top:'16px',height:'2px',background:T.dark?T.heavy:'rgba(23,20,15,0.2)'}}),
          h('div',{style:{position:'absolute',left:0,width:pct+'%',top:'16px',height:'2px',background:T.ink}}),
          h('div',{style:{position:'absolute',left:0,right:0,top:'12px',height:'10px',display:'flex',justifyContent:'space-between'}},
            Array.from({length:stops},(_,i)=>h('div',{key:i,style:{width:'1.5px',background:T.dark?T.heavy:'rgba(23,20,15,0.4)'}}))),
          h('div',{style:{position:'absolute',left:pct+'%',top:'3px',width:'20px',height:'28px',background:T.accent,transform:'translateX(-50%)',borderRadius:(T.dark?3:0)+'px'}}),
          h('div',{style:{position:'absolute',inset:0,display:'flex'}},
            Array.from({length:stops},(_,i)=>h('div',{key:i,onClick:()=>set({[key]:i}),style:{flex:1,cursor:'pointer'}})))),
        h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'5px',fontSize:'9px',fontWeight:600,letterSpacing:'0.12em',color:T.soft}},
          h('span',null,leftL), centerL?h('span',{style:{color:T.ink,fontWeight:700}},centerL):null, h('span',null,rightL)));
    };
    const cancel=()=>this.setState({phase:'logging'});
    return h('div',{style:{position:'absolute',inset:0,zIndex:31}},
      this.dim(cancel),
      h('div',{style:{position:'absolute',left:0,right:0,bottom:0,maxHeight:'92%',display:'flex',flexDirection:'column',background:T.bg,borderTop:(T.dark?T.bw:2)+'px solid '+T.line,borderTopLeftRadius:(T.dark?T.rCard:0)+'px',borderTopRightRadius:(T.dark?T.rCard:0)+'px',zIndex:32,boxShadow:T.dark?'0 -16px 40px rgba(0,0,0,0.55)':'none'}},
        h('div',{style:{flexShrink:0,padding:'20px 20px 0'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline'}},
            h('div',{style:{fontSize:'26px',fontWeight:800,letterSpacing:'-0.02em'}},'Feedback'),
            h('div',{onClick:cancel,style:{fontSize:'16px',color:T.soft,cursor:'pointer'}},'\u2715')),
          h('div',{style:{fontSize:'10px',fontWeight:600,letterSpacing:'0.14em',color:T.soft,marginTop:'4px'}},'GLUTES \u2014 AFTER DEADLIFT \u00B7 FEEDS W3 TARGETS')),
        h('div',{className:'wk-scroll',style:{flex:1,minHeight:0,overflowY:'auto',padding:'0 20px 6px'}},
          pain,
          slider('pump','Glutes pump','\u2014 today','outline','NO PUMP','BEST EVER',null,null),
          slider('workload','Glutes workload','\u2014 whole session','filled','TOO EASY','TOO MUCH','JUST RIGHT',"How taxing all of today\u2019s glute work felt, recovery included. The middle means the dose was right \u2014 this sets next week\u2019s set count.")),
        h('div',{style:{flexShrink:0,display:'flex',gap:'10px',alignItems:'center',justifyContent:'flex-end',padding:'14px 20px 40px'}},
          h('div',{onClick:cancel,style:{fontSize:'13px',fontWeight:600,padding:'12px 18px',color:T.soft,cursor:'pointer'}},'Cancel'),
          h('div',{onClick:()=>this.setState({phase:'complete'}),style:{background:T.selFill,color:T.selInk,fontSize:'13px',fontWeight:700,letterSpacing:'0.08em',padding:'14px 32px',cursor:'pointer',borderRadius:T.rInput+'px'}},'SAVE'))));
  }

  renderComplete(T){ const h=React.createElement; const tt=this.totals();
    const doneEx=this.state.exercises.filter(ex=>ex.sets.length>0&&ex.sets.every(s=>s.d)).length;
    const skipped=tt.total-tt.logged;
    const statRow=(l,r)=>h('div',{style:{display:'flex',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid '+(T.dark?T.lineSoft:'rgba(23,20,15,0.18)'),fontSize:'14px'}},
      h('span',{style:{fontWeight:500,color:T.soft}},l),h('span',{style:{fontWeight:700,fontVariantNumeric:'tabular-nums'}},r));
    const cancel=()=>this.setState({phase:'logging'});
    return h('div',{style:{position:'absolute',inset:0,zIndex:33}},
      this.dim(cancel),
      h('div',{style:{position:'absolute',left:0,right:0,bottom:0,maxHeight:'92%',display:'flex',flexDirection:'column',background:T.bg,borderTop:(T.dark?T.bw:2)+'px solid '+T.line,borderTopLeftRadius:(T.dark?T.rCard:0)+'px',borderTopRightRadius:(T.dark?T.rCard:0)+'px',zIndex:34,boxShadow:T.dark?'0 -16px 40px rgba(0,0,0,0.55)':'none'}},
        h('div',{className:'wk-scroll',style:{flex:1,minHeight:0,overflowY:'auto',padding:'24px 20px 0'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline'}},
            h('div',{style:{fontSize:'30px',fontWeight:800,letterSpacing:'-0.02em'}},this.state.week+'\u00B7'+this.state.day+' complete.'),
            h('div',{onClick:cancel,style:{fontSize:'16px',color:T.soft,cursor:'pointer'}},'\u2715')),
          h('div',{style:{marginTop:'20px',borderTop:(T.dark?T.bw:1.5)+'px solid '+T.line}},
            statRow('Exercises completed',doneEx),
            statRow('Sets logged',tt.logged+' / '+tt.total),
            statRow('Skipped',skipped)),
          h('div',{style:{marginTop:'18px'}},
            h('div',{style:{fontSize:'10px',fontWeight:600,letterSpacing:'0.14em',color:T.soft}},'WORKOUT NOTES \u2014 SAVED WITH SESSION'),
            h('textarea',{value:this.state.notes,onChange:(e)=>this.setState({notes:e.target.value}),placeholder:'Anything worth remembering for next time\u2026',style:{width:'100%',minHeight:'64px',marginTop:'7px',background:T.field,border:T.bw+'px solid '+T.line,borderRadius:T.rInput+'px',padding:'10px 12px',fontFamily:"'Archivo',sans-serif",fontSize:'13px',lineHeight:1.5,color:T.ink,resize:'none',outline:'none',boxSizing:'border-box'}}))),
        h('div',{style:{flexShrink:0,padding:'14px 20px 40px'}},
          h('div',{onClick:()=>this.nextWorkout(),style:{background:T.selFill,color:T.selInk,display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',fontSize:'14px',fontWeight:700,letterSpacing:'0.1em',padding:'17px 0',cursor:'pointer',borderRadius:T.rInput+'px'}},'NEXT WORKOUT ',h('span',{style:{fontSize:'15px'}},'\u2192')))));
  }

  // ---------- format ----------
  pad(n){ return n<10?('0'+n):(''+n); }
  fmt(v,field){ if(field==='w'){ return (Math.round(v*10)/10).toString().replace(/\.0$/,''); } return ''+v; }
}
</script>
