<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 176" width="460" height="176" role="img">
  <!-- doc 22 Phase 3b (09-changelog 2026-08-10 §1).
       "Draw what is structural" — doc 22 §8.4b rule 7. The planner board is
       groups-first (day → muscle-group block → exercise slots) and that is the
       one thing about it a reader has to hold in their head before any control
       makes sense. A list makes them assemble the nesting; a tree hands it over.

       Single-colour line art on transparent: the renderer uses it as a CSS mask
       filled with `currentColor`, so it is correct in both themes.

       Dashed = planned/empty (hard rule 7), which is the board's own grammar for
       an open slot — so the figure teaches the mark it will meet on screen.

       Nothing tunable is baked in: "3 SETS" is one plausible starting count, not
       a default the engine owns, and the day/groups are an example split. -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- the day: one tab on the board -->
    <rect x="1" y="1" width="200" height="34" fill="none" stroke="#000" stroke-width="2.5"/>
    <text x="15" y="23" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">DAY 2 — PULL</text>

    <!-- spine: the day's muscle-group blocks hang off it -->
    <rect x="19.25" y="35" width="1.5" height="115" fill="#000"/>

    <!-- muscle-group block 1 -->
    <rect x="20" y="75.25" width="24" height="1.5" fill="#000"/>
    <rect x="44" y="64" width="24" height="24" fill="none" stroke="#000" stroke-width="2"/>
    <text x="56" y="81" font-size="11" font-weight="800" letter-spacing="0.5" text-anchor="middle" fill="#000">BA</text>
    <text x="76" y="73" font-size="12" font-weight="700" letter-spacing="1.2" fill="#000">BACK</text>
    <text x="76" y="87" font-size="9.5" font-weight="600" letter-spacing="1" fill="#000">2 EXERCISES</text>

    <!-- its two exercise slots, both filled -->
    <rect x="172" y="75.25" width="14" height="1.5" fill="#000"/>
    <rect x="185.25" y="63" width="1.5" height="36" fill="#000"/>
    <rect x="186" y="62.25" width="10" height="1.5" fill="#000"/>
    <rect x="186" y="98.25" width="10" height="1.5" fill="#000"/>
    <rect x="196" y="48" width="250" height="30" fill="none" stroke="#000" stroke-width="2"/>
    <text x="208" y="68" font-size="12.5" font-weight="600" fill="#000">Barbell Row</text>
    <text x="434" y="68" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="end" fill="#000">3 SETS</text>
    <rect x="196" y="84" width="250" height="30" fill="none" stroke="#000" stroke-width="2"/>
    <text x="208" y="104" font-size="12.5" font-weight="600" fill="#000">Lat Pulldown</text>
    <text x="434" y="104" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="end" fill="#000">3 SETS</text>

    <!-- muscle-group block 2 -->
    <rect x="20" y="149.25" width="24" height="1.5" fill="#000"/>
    <rect x="44" y="138" width="24" height="24" fill="none" stroke="#000" stroke-width="2"/>
    <text x="56" y="155" font-size="11" font-weight="800" letter-spacing="0.5" text-anchor="middle" fill="#000">BI</text>
    <text x="76" y="147" font-size="12" font-weight="700" letter-spacing="1.2" fill="#000">BICEPS</text>
    <text x="76" y="161" font-size="9.5" font-weight="600" letter-spacing="1" fill="#000">1 EXERCISE</text>

    <!-- its one slot, still open — dashed, the board's own mark for empty -->
    <rect x="172" y="149.25" width="24" height="1.5" fill="#000"/>
    <rect x="196" y="135" width="250" height="30" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="208" y="155" font-size="12.5" font-weight="600" fill="#000">pick exercise</text>
    <text x="434" y="155" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="end" fill="#000">OPEN SLOT</text>
  </g>
</svg>
