<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 272" width="560" height="272" role="img">
  <!-- doc 22 Phase 3a, owner review round 3 (09-changelog 2026-08-09 §3).
       "Draw what is structural" — doc 22 §8.4b rule 7. The nesting is the whole
       point of the cycle model and a bulleted list makes the reader assemble it.

       Single-colour line art on transparent: the renderer uses it as a CSS mask
       filled with `currentColor`, so it is correct in both themes.

       The profile sits OUTSIDE the stack rather than as a fifth frame around it
       (owner's note: the goal arc rests on who you are). Drawn as an input,
       because a profile is not a period of time and nesting it would say it is.

       Nothing tunable is baked in: the duration hints are the shape of each
       layer ("months", "weeks"), never a bound. `mesocycle`'s own 3–8 weeks is
       the glossary's to state, in text, where a change can be grepped.

       Frame insets are 26px, which is the tightest that clears each frame's own
       label (13px caps, baseline 20px below its top edge) by a visible margin.
       Checked by rendering, not by arithmetic. -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- the input: your profile, level with the middle of the stack -->
    <rect x="1" y="113" width="112" height="46" fill="none" stroke="#000" stroke-width="2"/>
    <text x="57" y="132" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#000">YOUR</text>
    <text x="57" y="148" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#000">PROFILE</text>

    <!-- feeds the goal arc -->
    <rect x="113" y="135.25" width="27" height="1.5" fill="#000"/>
    <polygon points="140,130 150,136 140,142" fill="#000"/>

    <!-- macrocycle — the outer frame -->
    <rect x="151" y="21" width="398" height="230" fill="none" stroke="#000" stroke-width="2.5"/>
    <text x="165" y="41" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">MACROCYCLE</text>
    <text x="535" y="41" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#000">MONTHS</text>

    <!-- mesocycle -->
    <rect x="177" y="47" width="346" height="178" fill="none" stroke="#000" stroke-width="2"/>
    <text x="191" y="67" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">MESOCYCLE</text>
    <text x="509" y="67" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#000">WEEKS</text>

    <!-- microcycle -->
    <rect x="203" y="73" width="294" height="126" fill="none" stroke="#000" stroke-width="2"/>
    <text x="217" y="93" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">MICROCYCLE</text>
    <text x="483" y="93" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#000">ONE WEEK</text>

    <!-- workout — the innermost, and the one you actually stand in -->
    <rect x="229" y="99" width="242" height="74" fill="none" stroke="#000" stroke-width="2"/>
    <text x="243" y="119" font-size="13" font-weight="700" letter-spacing="1.5" fill="#000">WORKOUT</text>
    <text x="457" y="119" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#000">ONE SESSION</text>

    <!-- the coordinate the day screen shows, sitting where it belongs -->
    <text x="350" y="155" font-size="21" font-weight="800" letter-spacing="0.5" text-anchor="middle" fill="#000">W3·D2</text>
  </g>
</svg>
