# R23: keep dependencies current without manual sweeps. Weekly, batched into
# two grouped PRs (prod/dev) so the update stream stays reviewable; majors are
# left to deliberate upgrades.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # mcp-handler pins an exact peer of @modelcontextprotocol/sdk (1.26.0 as
      # of 1.1.0); any solo SDK bump breaks `npm ci` with ERESOLVE (PR #126
      # took prod builds down). Bump the SDK only together with an mcp-handler
      # release whose peer range admits it.
      - dependency-name: "@modelcontextprotocol/sdk"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
